name: agenda_visiva
description: >-
  Agende visive per bambini autistici e con svantaggio linguistico.
  Gratuita per sempre. Offline-first, zero tracker.
publish_to: none
version: 1.3.2+8

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # State management
  flutter_riverpod: ^2.5.1

  # Persistenza
  drift: ^2.35.0
  drift_flutter: ^0.3.0
  path_provider: ^2.1.4

  uuid: ^4.5.0
  crypto: ^3.0.5

  # Navigazione
  go_router: ^14.2.0

  # ARASAAC + media
  http: ^1.2.2
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  # Fallback Dart puro dove flutter_image_compress non esiste (Windows)
  image: ^4.13.1
  cached_network_image: ^3.4.1

  # Export
  pdf: ^3.11.1
  printing: ^5.13.2
  qr_flutter: ^4.1.0
  archive: ^4.7.1
  share_plus: ^10.0.0
  file_picker: ^8.1.2

  # Accessibilità
  flutter_tts: ^4.0.2
  url_launcher: ^6.3.2

  # Voce registrata dall'adulto (file locale, nessun servizio remoto)
  record: ^7.2.0
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Screenshot per gli store (integration_test/store_screenshots_test.dart)
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  drift_dev: ^2.35.0
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.1
  msix: ^3.18.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/pictograms/builtin/
    - assets/branding/
    - assets/fonts/

flutter_native_splash:
  color: "#00897B"
  image: assets/branding/splash_icon.png
  android_12:
    color: "#00897B"
    image: assets/branding/splash_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/icon_fullbleed.png
  remove_alpha_ios: true
  adaptive_icon_background: "#00897B"
  adaptive_icon_foreground: assets/branding/icon_adaptive_fg.png
  macos:
    generate: true
    image_path: assets/branding/icon_macos.png
  windows:
    generate: true
    image_path: assets/branding/logo.png
    icon_size: 256

# Pacchetto Microsoft Store: dart run msix:create (su Windows, dopo
# flutter build windows). identity_name e publisher vanno copiati da
# Partner Center → app → Identità del prodotto: finché sono i segnaposto
# qui sotto lo Store rifiuta il pacchetto (nessun rischio di upload errato).
msix_config:
  display_name: Agenda Visiva
  publisher_display_name: Davide Bertolino
  identity_name: SEGNAPOSTO.AgendaVisiva
  publisher: CN=SEGNAPOSTO-DA-PARTNER-CENTER
  logo_path: assets/branding/logo.png
  languages: it-it, en-us
  # internetClient: solo pittogrammi ARASAAC. microphone: voce registrata.
  capabilities: internetClient, microphone
  store: true
